<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="How Navero App handles information in Everyday Sudoku, including game data, optional ads, purchases and support."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Everyday Sudoku Privacy Policy · Navero App</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #faf9f5;
        --surface: #f0f1eb;
        --ink: #23282e;
        --muted: #58615a;
        --line: #d9ddd3;
        --accent: #405e4a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          1rem/1.65 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      main,
      footer {
        width: min(100% - 3rem, 46rem);
        margin-inline: auto;
      }
      main {
        padding-block: 3.5rem 2rem;
      }
      .brand {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1,
      h2 {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 400;
        line-height: 1.15;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.4rem, 7vw, 3.7rem);
      }
      h2 {
        margin: 2.5rem 0 1rem;
        font-size: 1.9rem;
      }
      h3 {
        margin: 2rem 0 0.5rem;
        font-size: 1.1rem;
        line-height: 1.4;
      }
      p {
        margin: 0.75rem 0;
      }
      .intro {
        color: var(--muted);
        font-size: 1.1rem;
      }
      a {
        color: var(--accent);
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.2em;
        overflow-wrap: anywhere;
      }
      a:hover {
        text-decoration-thickness: 0.15em;
      }
      a:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 5px;
        border-radius: 2px;
      }
      .contact {
        padding: 1.5rem;
        margin-top: 2rem;
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        background: var(--surface);
      }
      .contact h2 {
        margin-top: 0;
      }
      .email {
        display: inline-block;
        padding-block: 0.35rem;
        font-size: 1.2rem;
        font-weight: 600;
      }
      ul {
        padding-left: 1.4rem;
      }
      li {
        margin-block: 0.3rem;
      }
      .note {
        color: var(--muted);
        font-size: 0.92rem;
      }
      footer {
        padding-block: 1.5rem 2.5rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }
      footer a {
        display: inline-block;
        padding-block: 0.5rem;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #23282e;
          --surface: #2e353a;
          --ink: #faf9f5;
          --muted: #c2cbc3;
          --line: #505b53;
          --accent: #c2ddc7;
        }
      }
      @media (max-width: 420px) {
        main,
        footer {
          width: calc(100% - 2rem);
        }
        main {
          padding-top: 2rem;
        }
        .contact {
          padding: 1.1rem;
        }
      }
      article > h1 + p {
        color: var(--muted);
        margin-bottom: 2rem;
        font-size: 0.92rem;
      }
      article h2 {
        padding-top: 1.5rem;
        border-top: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Navero App · Everyday Sudoku</p>
      <article aria-label="Privacy policy">
        {{ content }}
      </article>
    </main>
    <footer>
      <a href="https://boer-design.github.io/Everyday-sudoku/support/">Get support</a>
      <p class="note">Everyday Sudoku · Navero App</p>
    </footer>
  </body>
</html>
